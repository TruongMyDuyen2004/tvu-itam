<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - TVU-ITAM</title>
    <meta name="description" content="Đặt lại mật khẩu - Hệ thống Quản lý Tài sản CNTT - Đại học Trà Vinh">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3a5f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TVU-ITAM">
    <link rel="apple-touch-icon" href="/assets/images/logo-tvu.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #1e3a5f;
            --primary-light: #2563eb;
            --primary-gradient: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 30%, #dbeafe 60%, #eff6ff 100%);
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 15% 30%, rgba(30,58,95,.08) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 70%, rgba(37,99,235,.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(30,58,95,.08), 0 1px 4px rgba(0,0,0,.04);
            padding: 2.5rem 2rem 2rem;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(30,58,95,.06);
        }

        .card-header { text-align: center; margin-bottom: 2rem; }
        .card-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1rem;
            display: block;
            box-shadow: 0 4px 20px rgba(30,58,95,.12);
            border: 3px solid #fff;
            outline: 2px solid rgba(30,58,95,.08);
        }
        .card-gov {
            font-size: .68rem;
            color: #94a3b8;
            letter-spacing: .08em;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: .2rem;
        }
        .card-school {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: .02em;
        }
        .card-dept {
            font-size: .75rem;
            color: #64748b;
            margin-top: .15rem;
            font-weight: 500;
        }
        .card-title {
            font-size: .9rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 1rem;
            letter-spacing: .1em;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block;
            font-size: .78rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: .45rem;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            transition: all .25s ease;
        }
        .input-box:focus-within {
            border-color: var(--primary-light);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37,99,235,.1);
        }
        .input-box .icon-left {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: #94a3b8;
            pointer-events: none;
            transition: color .25s;
        }
        .input-box:focus-within .icon-left { color: var(--primary-light); }
        .input-box input {
            width: 100%;
            padding: .8rem 3rem .8rem 2.6rem;
            background: transparent;
            border: none;
            color: #0f172a;
            font-size: .9rem;
            font-family: inherit;
            outline: none;
        }
        .input-box input::placeholder { color: #b0b8c4; }
        .btn-eye {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #94a3b8;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color .2s, background .2s;
        }
        .btn-eye:hover { color: #475569; background: rgba(0,0,0,.04); }
        .btn-eye svg { width: 18px; height: 18px; }

        .btn-submit {
            width: 100%;
            padding: .9rem;
            border: none;
            border-radius: 14px;
            font-size: .92rem;
            font-weight: 800;
            font-family: inherit;
            color: #fff;
            background: var(--primary-gradient);
            cursor: pointer;
            transition: all .3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(30,58,95,.25);
            margin-top: .5rem;
            letter-spacing: .02em;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(30,58,95,.35);
        }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-submit .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .6s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            font-size: .82rem;
            color: #dc2626;
            background: rgba(220,38,38,.06);
            border: 1px solid rgba(220,38,38,.15);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 14px;
            text-align: center;
            line-height: 1.5;
            display: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.25rem;
            font-size: .82rem;
            color: #64748b;
        }
        .back-link a {
            color: var(--primary-light);
            font-weight: 700;
            text-decoration: none;
            transition: color .2s;
        }
        .back-link a:hover { text-decoration: underline; }

        .card-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .72rem;
            color: #94a3b8;
        }
        .card-footer a { color: #94a3b8; text-decoration: none; }
        .card-footer a:hover { color: var(--primary-light); }

        @media (max-width: 480px) {
            .card { padding: 2rem 1.5rem 1.5rem; border-radius: 16px; }
            .card-logo { width: 68px; height: 68px; }
        }
    </style>
</head>
<body>
    <div style="width:100%;max-width:440px;position:relative;z-index:1">
        <div class="card">
            <div class="card-header">
                <img src="assets/images/logotvu.jpg" alt="Đại học Trà Vinh" class="card-logo">
                <div class="card-gov">Ủy ban nhân dân tỉnh Vĩnh Long</div>
                <div class="card-school">ĐẠI HỌC TRÀ VINH</div>
                <div class="card-dept">PHÒNG CÔNG NGHỆ THÔNG TIN</div>
                <div class="card-title">ĐẶT LẠI MẬT KHẨU</div>
            </div>

            <form id="resetForm" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="new_password">Mật khẩu mới</label>
                    <div class="input-box">
                        <svg class="icon-left" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/></svg>
                        <input type="password" id="new_password" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password" minlength="6">
                        <button type="button" class="btn-eye" id="togglePwd" title="Hiện/ẩn mật khẩu">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Xác nhận mật khẩu</label>
                    <div class="input-box">
                        <svg class="icon-left" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/></svg>
                        <input type="password" id="confirm_password" placeholder="Nhập lại mật khẩu mới" required autocomplete="new-password" minlength="6">
                        <button type="button" class="btn-eye" id="togglePwdConfirm" title="Hiện/ẩn mật khẩu">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-closed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div id="resetError" class="error-box"></div>
                <button type="submit" class="btn-submit" id="resetBtn">
                    <span id="resetBtnText">Đặt lại mật khẩu</span>
                    <svg class="spinner" id="resetSpinner" viewBox="0 0 24 24"></svg>
                </button>
                <div class="back-link">
                    <a href="/">Quay lại đăng nhập</a>
                </div>
            </form>
        </div>
        <p class="card-footer">© 2026 <a href="https://tvu.edu.vn" target="_blank">Đại học Trà Vinh</a> — Ban Công nghệ Thông tin (BCNTT)</p>
    </div>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/reset-password.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js').catch(err => {
                console.error('SW registration failed:', err);
            });
        });
    }
    </script>
</body>
</html>
